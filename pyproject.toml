[project]
name = "checkcopyrun"
version = "0.0.0"   # source of truth: config/constants.py APP_VERSION
description = "Utility to check, copy & run application folders (Windows)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "pywin32>=312",
]

[tool.uv]
# Проект — набор скриптов, а не устанавливаемый пакет:
# uv только создаёт окружение с зависимостями и запускает файлы из корня.
package = false

[dependency-groups]
dev = [
    "nuitka>=4.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
