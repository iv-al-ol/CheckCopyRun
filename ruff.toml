# Строка строго до 120 символов
line-length = 120
# Целевая версия Python: совпадает с .python-version (3.12)
target-version = "py312"
# Исключаем стандартные папки сборки и кэша
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    ".git",
    ".ai",
    # Утилита разработчика: свой CLI-стиль, в приложение не входит.
    "tools",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (ошибки логики, неиспользуемые переменные)
    "I",    # isort (сортировка импортов)
    "N",    # pep8-naming (именование классов/функций)
    "UP",   # pyupgrade (автоматический апгрейд синтаксиса до Python 3.12)
    "ANN",  # flake8-annotations (строгая проверка аннотаций типов)
    "ASYNC",# flake8-async (проверка асинхронного кода)
    "S",    # flake8-bandit (безопасность: запрет eval/exec, проверка секретов)
    "RUF",  # Ruff-specific rules (специфичные полезные проверки от Ruff)
]

# PTH (flake8-use-pathlib) намеренно НЕ включён.
# .zoorules §5 требует: любой I/O — через core/long_io.py, а манипуляции
# путями — через os.path.abspath/normcase. pathlib.Path.resolve() не
# поддерживает длинные пути Windows, поэтому PTH системно противоречит
# архитектуре проекта и давал бы ~80 неустранимых ложных срабатываний.

ignore = [
    # Any в редких случаях (обёртки над ctypes/tkinter).
    "ANN401",
    # Кириллическая типографика в текстах: «», —, …, →, №.
    # RUF001/002 — строковые литералы, RUF003 — комментарии.
    "RUF001",
    "RUF002",
    "RUF003",
]

# Автоматически исправлять безопасные ошибки при запуске `ruff check --fix`
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# В тестах разрешаем не писать docstrings и не проверять некоторые безопасности
"tests/**/*.py" = [
    "S101",
    "S108",  # временные пути в тестах безопасны
    "ANN",
    "D",
]
# В точках входа (main.py) разрешаем отсутствие некоторых аннотаций, если они мешают
"main.py" = ["ANN"]
# UI-слой: master/window/event — нетипизированные объекты tkinter.
# Аннотировать их нечем, кроме Any, что не даёт пользы и шумит
# на ~200 замечаний. Сервисный и core-слой остаются под строгим ANN.
"ui/**/*.py" = ["ANN"]
# WinAPI-структура: имя зафиксировано в ctypes-определении.
"services/system/dpapi.py" = ["N801"]
# Скрипт сборки — доверенный вызов sys.executable.
"build.py" = ["S603"]

[lint.isort]
known-first-party = ["config", "core", "services", "ui", "utils"]

# --- Настройки форматтера Ruff ---
[format]
# Используем двойные кавычки для строк
quote-style = "double"
# Используем пробелы для отступов
indent-style = "space"
# Автоматически определять окончание строк (LF для Linux/Mac, CRLF для Windows)
line-ending = "auto"
